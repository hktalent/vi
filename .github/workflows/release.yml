name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  QDRANT_VERSION: "v1.15.1"

jobs:
  models:
    name: Package face models
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Archive models
        shell: bash
        run: |
          set -euo pipefail
          # models/ 体积大，被 .gitignore 排除，CI 检出时通常不存在 → 不阻塞 Release
          if [ -d models ]; then
            tar -czf face-models.tar.gz models
            shasum -a 256 face-models.tar.gz > face-models.tar.gz.sha256
          else
            echo "::warning::models/ 未纳入 git（见 .gitignore），跳过模型包"
          fi
      - name: Upload models artifact
        uses: actions/upload-artifact@v4
        with:
          name: face-models
          path: |
            face-models.tar.gz
            face-models.tar.gz.sha256
          if-no-files-found: ignore
          retention-days: 1

  build:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # CGO 交叉编译不可行，每个平台用原生 runner 构建（含 importfaces，需 OpenCV）
          - { goos: linux,   goarch: amd64, os: linux,   arch: amd64, runner: ubuntu-latest }
          - { goos: linux,   goarch: arm64, os: linux,   arch: arm64, runner: ubuntu-24.04-arm }
          - { goos: darwin,  goarch: amd64, os: darwin,  arch: amd64, runner: macos-13 }
          - { goos: darwin,  goarch: arm64, os: darwin,  arch: arm64, runner: macos-latest }
          - { goos: windows, goarch: amd64, os: windows, arch: amd64, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.sum

      - name: Install OpenCV (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopencv-dev pkg-config

      - name: Install OpenCV (macOS)
        if: matrix.os == 'darwin'
        run: brew install opencv pkg-config

      - name: Cache OpenCV (Windows)
        if: matrix.os == 'windows'
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: C:\opencv
          key: opencv-4.10.0-mingw-v1

      - name: Setup MinGW (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          choco install -y mingw --no-progress
          echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # gocv v0.38.0 硬编码链接 C:/opencv/build/install 下的 OpenCV 4.10（含 contrib 模块）。
      # 源码编译约 30-60 分钟，已加 cache，只有首次/缓存失效才执行。
      - name: Build OpenCV 4.10 from source (Windows, cache miss)
        if: matrix.os == 'windows' && steps.opencv-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          mkdir C:\opencv\build 2>nul || ver >nul
          echo ==^> Download OpenCV sources
          curl -fsSL -o C:\opencv\opencv.zip https://github.com/opencv/opencv/archive/4.10.0.zip
          curl -fsSL -o C:\opencv\contrib.zip https://github.com/opencv/opencv_contrib/archive/4.10.0.zip
          tar -xf C:\opencv\opencv.zip -C C:\opencv
          tar -xf C:\opencv\contrib.zip -C C:\opencv
          del C:\opencv\opencv.zip C:\opencv\contrib.zip
          echo ==^> Configure
          cmake C:\opencv\opencv-4.10.0 -G "MinGW Makefiles" -BC:\opencv\build -DENABLE_CXX11=ON -DOPENCV_EXTRA_MODULES_PATH=C:\opencv\opencv_contrib-4.10.0\modules -DCMAKE_BUILD_TYPE=RELEASE -DBUILD_SHARED_LIBS=ON -DWITH_IPP=OFF -DWITH_MSMF=OFF -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_opencv_java=OFF -DBUILD_opencv_python=OFF -DBUILD_opencv_python2=OFF -DBUILD_opencv_python3=OFF -DBUILD_DOCS=OFF -DENABLE_PRECOMPILED_HEADERS=OFF -DBUILD_opencv_saliency=OFF -DBUILD_LIST=core,imgproc,imgcodecs,videoio,video,highgui,calib3d,features2d,flann,photo,dnn,objdetect,xfeatures2d,aruco,wechat_qrcode,bgsegm,tracking,plot,img_hash,ximgproc,face -DCPU_DISPATCH= -DWITH_OPENCL_D3D11_NV=OFF -Wno-dev
          echo ==^> Build (this takes a while)
          cmake --build C:\opencv\build --parallel %NUMBER_OF_PROCESSORS%
          cmake --build C:\opencv\build --target install
          rmdir C:\opencv\opencv-4.10.0 /s /q
          rmdir C:\opencv\opencv_contrib-4.10.0 /s /q

      # 守卫：go.mod 里绝不允许出现本机绝对路径的 replace（曾因 /tmp/gocv_patched 导致构建失败）
      - name: Guard go.mod against local replaces
        shell: bash
        run: |
          if grep -qE '^[[:space:]]*replace[[:space:]]+.*=>[[:space:]]*/' go.mod; then
            echo "::error::go.mod 中含有绝对路径 replace，请先执行 ./scripts/restore-gocv.sh 并提交干净的 go.mod"
            grep -nE '^[[:space:]]*replace' go.mod
            exit 1
          fi

      - name: Prepare patched gocv
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/patch-gocv.sh
          grep -nE 'gocv\.io/x/gocv' go.mod

      - name: Build vi
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist/bin
          go build -tags importface -trimpath -ldflags "-s -w -X main.Version=${{ github.ref_name }}" -o dist/bin/vi${{ matrix.os == 'windows' && '.exe' || '' }} .

      # 无论构建成败都恢复 go.mod，避免脏 go.mod 被带到下一步/被提交
      - name: Restore go.mod
        if: always()
        shell: bash
        run: ./scripts/restore-gocv.sh || true

      - name: Bundle OpenCV DLLs (Windows)
        if: matrix.os == 'windows'
        shell: bash
        run: cp /c/opencv/build/install/x64/mingw/bin/*.dll dist/bin/

      - name: Download qdrant
        env:
          QDRANT_VERSION: ${{ env.QDRANT_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          os="${{ matrix.os }}"
          arch="${{ matrix.arch }}"
          case "$os" in
            darwin) qdrant_os="darwin"; ext="tar.gz" ;;
            linux) qdrant_os="linux"; ext="tar.gz" ;;
            windows) qdrant_os="windows"; ext="zip" ;;
          esac
          case "$arch" in
            amd64) qdrant_arch="x86_64" ;;
            arm64) qdrant_arch="aarch64" ;;
          esac
          asset="qdrant-${qdrant_arch}-unknown-${qdrant_os}-musl.${ext}"
          url="https://github.com/qdrant/qdrant/releases/download/${QDRANT_VERSION}/${asset}"
          echo "Downloading $url"
          curl -fL "$url" -o "qdrant.${ext}"
          mkdir -p qdrant-dist
          case "$ext" in
            tar.gz) tar -xzf "qdrant.${ext}" -C qdrant-dist ;;
            zip) unzip -o "qdrant.${ext}" -d qdrant-dist ;;
          esac
          binpath=$(find qdrant-dist -type f -name "qdrant*" | head -n1)
          mkdir -p dist/bin
          cp "$binpath" "dist/bin/qdrant"
          chmod +x dist/bin/qdrant || true

      - name: Assemble package
        shell: bash
        run: |
          set -euo pipefail
          PKG="vi-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}"
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          mkdir -p "dist/$PKG"
          cp -r web statics config.example.yaml README.md dist/bin "dist/$PKG/"
          cp -r scripts "dist/$PKG/" 2>/dev/null || true
          mkdir -p "dist/$PKG/models/haarcascades"
          base="https://raw.githubusercontent.com/opencv/opencv/4.10.0/data/haarcascades"
          for f in haarcascade_frontalface_default.xml haarcascade_frontalface_alt.xml haarcascade_frontalface_alt2.xml haarcascade_eye.xml haarcascade_smile.xml; do
            curl -fsSL "$base/$f" -o "dist/$PKG/models/haarcascades/$f"
          done
          # YuNet DNN 人脸检测模型：优先用 git 内置副本，缺失则从 opencv_zoo 下载兜底
          if [ -f models/face_detection_yunet_2023mar.onnx ]; then
            cp models/face_detection_yunet_2023mar.onnx "dist/$PKG/models/"
          else
            curl -fsSL "https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx" \
              -o "dist/$PKG/models/face_detection_yunet_2023mar.onnx"
          fi
          if [ -f start.sh ]; then cp start.sh "dist/$PKG/"; fi
          rm -f "dist/$PKG/scripts/package.sh"

      - name: Archive package
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          case "${{ matrix.os }}" in
            windows) zip -qr "${PKG}.zip" "$PKG" ;;
            *) tar -czf "${PKG}.tar.gz" "$PKG" ;;
          esac
          shasum -a 256 "${PKG}".* > "${PKG}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/${{ env.PKG }}.tar.gz
            dist/${{ env.PKG }}.zip
            dist/${{ env.PKG }}.sha256
          if-no-files-found: ignore
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [models, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: false
